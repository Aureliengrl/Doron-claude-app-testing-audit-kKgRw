# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The following lint set is used for DORÕN:
# - Core Flutter + Dart recommended rules
# - Additional rules for production code quality
#
# Reference: https://dart.dev/guides/language/analysis-options

include: package:flutter_lints/flutter.yaml

analyzer:
  # Treat these as errors (fail CI)
  errors:
    # Security
    avoid_print: error            # Use AppLogger instead
    # Type safety
    missing_return: error
    invalid_assignment: error
    # Dead code
    unused_import: warning
    unused_local_variable: warning
    dead_code: warning
  exclude:
    - "**/*.g.dart"               # Generated files
    - "**/*.freezed.dart"         # Freezed generated
    - "lib/backend/**"            # FlutterFlow generated backend
    - "lib/flutter_flow/**"       # FlutterFlow generated UI utilities
    - "lib/custom_code/**"        # FlutterFlow custom actions (legacy)

linter:
  rules:
    # ── Errors ────────────────────────────────────────────────────────────────
    avoid_print: true             # Must use AppLogger
    avoid_empty_else: true
    avoid_returning_null_for_future: true
    cancel_subscriptions: true
    close_sinks: true
    no_duplicate_case_values: true
    valid_regexps: true

    # ── Style ─────────────────────────────────────────────────────────────────
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_fields: true
    prefer_final_locals: true
    prefer_single_quotes: true
    unnecessary_const: true
    unnecessary_new: true
    unnecessary_null_checks: true
    unnecessary_this: true

    # ── Dart best practices ────────────────────────────────────────────────────
    annotate_overrides: true
    await_only_futures: true
    camel_case_types: true
    non_constant_identifier_names: true
    prefer_is_empty: true
    prefer_is_not_empty: true
    use_super_parameters: true
    use_string_buffers: true

    # ── Flutter specific ───────────────────────────────────────────────────────
    sized_box_for_whitespace: true
    use_key_in_widget_constructors: true
    avoid_unnecessary_containers: true