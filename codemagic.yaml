workflows:

  # ──────────────────────────────────────────────
  # WORKFLOW iOS – App Store
  # ──────────────────────────────────────────────
  ios-release:
    name: iOS – App Store Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      groups:
        - firebase_credentials       # GOOGLE_SERVICES_IOS
        - appstore_credentials       # APP_STORE_CONNECT_* variables
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      # 1. Initialiser le keychain et télécharger le certificat + profil depuis Apple
      - name: Set up code signing
        script: |
          set -e

          echo "🔍 Vérification des variables App Store Connect..."
          if [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "❌ APP_STORE_CONNECT_PRIVATE_KEY manquante dans Codemagic env vars"
            exit 1
          fi
          if [ -z "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            echo "❌ APP_STORE_CONNECT_ISSUER_ID manquante dans Codemagic env vars"
            exit 1
          fi
          if [ -z "$APP_STORE_CONNECT_KEY_IDENTIFIER" ]; then
            echo "❌ APP_STORE_CONNECT_KEY_IDENTIFIER manquante dans Codemagic env vars"
            exit 1
          fi
          echo "✅ Variables App Store Connect présentes"

          keychain initialize

          echo "📥 Téléchargement des certificats et profils depuis Apple Developer..."
          app-store-connect fetch-signing-files \
            "com.mycompany.doron" \
            --type IOS_APP_STORE \
            --issuer-id @env:APP_STORE_CONNECT_ISSUER_ID \
            --key-id @env:APP_STORE_CONNECT_KEY_IDENTIFIER \
            --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY \
            --create

          echo "🔑 Ajout des certificats au keychain..."
          keychain add-certificates

          echo "📋 Vérification des profils téléchargés..."
          PROFILES_COUNT=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" 2>/dev/null | wc -l | tr -d ' ')
          echo "   → $PROFILES_COUNT profil(s) trouvé(s)"
          if [ "$PROFILES_COUNT" -eq "0" ]; then
            echo "❌ Aucun profil de provisionnement téléchargé !"
            echo "   Vérifiez que le bundle ID 'com.mycompany.doron' existe dans votre compte Apple Developer"
            exit 1
          fi

          echo "⚙️  Configuration du projet Xcode avec les profils..."
          xcode-project use-profiles

          echo "✅ Configuration du code signing terminée"

      # 2. Générer export_options.plist explicite (écrase celui généré par use-profiles)
      - name: Generate export options plist
        script: |
          # Récupérer le nom exact du profil installé
          PROFILE_NAME=$(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | plutil -extract Name raw - 2>/dev/null || echo "DORON.APP ios_app_store 1771937640")
          echo "📝 Profil utilisé : $PROFILE_NAME"

          cat > /Users/builder/export_options.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>8G596X24DA</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.mycompany.doron</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          echo "✅ export_options.plist généré avec method: app-store"

      # 3. Injecter GoogleService-Info.plist (si variable définie)
      - name: Inject GoogleService-Info.plist
        script: |
          if [ -n "$GOOGLE_SERVICES_IOS" ]; then
            echo "$GOOGLE_SERVICES_IOS" | base64 --decode > "$CM_BUILD_DIR/ios/Runner/GoogleService-Info.plist"
            echo "✅ GoogleService-Info.plist injecté"
          else
            echo "ℹ️  Pas de variable GOOGLE_SERVICES_IOS — fichier repo utilisé"
          fi

      # 4. Flutter pub get
      - name: Install Flutter dependencies
        script: flutter pub get

      # 5. Install CocoaPods
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;

      # 6. Build IPA
      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --export-options-plist /Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  # ──────────────────────────────────────────────
  # WORKFLOW Android – Release
  # ──────────────────────────────────────────────
  android-release:
    name: Android – Play Store Release
    max_build_duration: 120
    instance_type: linux_x2

    environment:
      groups:
        - firebase_credentials   # Groupe contenant GOOGLE_SERVICES_ANDROID
        - android_credentials    # Groupe contenant KEYSTORE_* variables
      flutter: stable

    scripts:
      # 1. Injecter google-services.json depuis la variable Base64
      - name: Inject google-services.json
        script: |
          if [ -n "$GOOGLE_SERVICES_ANDROID" ]; then
            echo "$GOOGLE_SERVICES_ANDROID" | base64 --decode > "$CM_BUILD_DIR/android/app/google-services.json"
            echo "✅ google-services.json injecté"
          else
            echo "⚠️  Variable GOOGLE_SERVICES_ANDROID non définie"
            exit 1
          fi

      # 2. Injecter le keystore de signature (si variable définie)
      - name: Inject Android Keystore
        script: |
          if [ -n "$CM_KEYSTORE" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/android/app/keystore.jks"
            echo "✅ Keystore injecté"
          else
            echo "ℹ️  Pas de keystore — build debug"
          fi

      # 3. Flutter pub get
      - name: Install Flutter dependencies
        script: flutter pub get

      # 4. Build AAB (App Bundle pour le Play Store)
      - name: Build Android App Bundle
        script: |
          if [ -n "$CM_KEYSTORE" ]; then
            flutter build appbundle --release \
              --dart-define=FLUTTER_BUILD_NUMBER=$BUILD_NUMBER
          else
            flutter build appbundle --debug
          fi

    artifacts:
      - build/app/outputs/bundle/**/*.aab
      - build/app/outputs/mapping/**/mapping.txt

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
